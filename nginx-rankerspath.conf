# ========================================================
# 1. MAIN WEBSITE: rankerspath.in & www.rankerspath.in
# ========================================================
server {
    listen 80;
    listen [::]:80;
    server_name rankerspath.co.in www.rankerspath.co.in rankerspath.in www.rankerspath.in;

    root /var/www/rankerproject/mainWebsitefronted/dist;
    index index.html;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html so updates are immediately visible
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # Reverse proxy backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static uploads directory
    location /uploads/ {
        alias /var/www/rankerproject/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 25M;
}

