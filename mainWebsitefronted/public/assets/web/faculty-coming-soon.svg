<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D"/>
      <stop offset="50%" stop-color="#142B5C"/>
      <stop offset="100%" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular grid -->
  <circle cx="200" cy="200" r="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <circle cx="200" cy="200" r="120" stroke="#FBBF24" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Silhouette Head & Body -->
  <g fill="#ffffff" fill-opacity="0.25">
    <!-- Head -->
    <circle cx="200" cy="145" r="50"/>
    <!-- Shoulders -->
    <path d="M110 310 C110 240, 150 215, 200 215 C250 215, 290 240, 290 310 Z"/>
  </g>
  
  <!-- Gold Badge / Sparkle Overlay -->
  <circle cx="200" cy="145" r="28" fill="#0B1B3D" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="200" y="157" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#FBBF24" text-anchor="middle">?</text>
  
  <!-- Bottom Ribbon text -->
  <rect x="70" y="325" width="260" height="44" rx="22" fill="#071126" stroke="#FBBF24" stroke-width="2"/>
  <text x="200" y="353" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FBBF24" text-anchor="middle">COMING SOON</text>
</svg>
